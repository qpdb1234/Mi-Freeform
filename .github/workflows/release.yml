name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.5.39 (must already exist)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        run: |
          for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [ -n "$root" ] && [ -d "$root" ]; then
              echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              echo "Using Android SDK at $root"
              break
            fi
          done

      - name: Install platform 32
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-32" "build-tools;30.0.3"

      - name: Read version
        id: version
        run: |
          code=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle | head -n1)
          name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$name versionCode=$code"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/Mi-Freeform-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Freeform-v${{ steps.version.outputs.name }}-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Mi-Freeform ${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          files: dist/*.apk
          body: |
            A maintenance fork based on upstream `main` (2.5.18 / 2798e82), version ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

            Changes since 2.5.38
            - Drag-to-scale is configurable per handle: the bottom-bar dots and the bottom corners each choose between proportional and free (width and height follow the finger independently); dots default to free, corners to proportional
            - Free resize updates the stored width/height ratio to the shape you set, so rotating the window keeps it instead of snapping back
            - No more jitter on very large windows: window-size commits during a drag are throttled to about 30fps instead of re-laying out the overlay on every finger movement; the exact final size is still committed on release

            Notes
            - The attached APK is a debug build: debuggable and unobfuscated, for trial only
            - Requires Shizuku or Sui to activate; Xposed is optional