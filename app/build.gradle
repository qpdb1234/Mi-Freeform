plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-android-extensions'
    id 'stringfog'
}

stringfog {
    // Required: the impl class path of the encrypt/decrypt library; must match the algorithm library configured above.
    implementation 'com.github.megatronking.stringfog.xor.StringFogImpl'
    // Optional: encryption switch, on by default.
    enable true
    // Optional: the code package paths to encrypt; multiple allowed, and unspecified means encrypt everything.
    fogPackages = ['com.moonlight.freeform']
}

// Signing material is read from keystore.properties at the repository root: this file is not committed
// (.gitignore already excludes keystore.properties and *.jks), so no password ever appears in the public repository.
// When the file is absent: debug uses the standard AGP debug certificate (CN=Android Debug) and the artifact installs normally;
// release gets no signingConfig and produces app-release-unsigned.apk, leaving the user to re-sign with their own key.
// This way anyone can build a fresh clone without any key, and no one publishes packages under the upstream author's key.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
// Only actually enable custom signing when both the config file and the keystore entity exist
def localSigningReady = keystorePropsFile.exists() &&
        keystoreProps.getProperty('storeFile') &&
        rootProject.file(keystoreProps.getProperty('storeFile')).exists()

android {
    compileSdk 32

    defaultConfig {
        // Application package name (applicationId): com.mifreeform.freeform.
        // The Java/Kotlin code namespace stays com.moonlight.freeform
        // (the source directory, R/BuildConfig, the class names in xposed_init, and the fully-qualified custom View
        // class names in layouts are all based on namespace; keeping them avoids a large-scale change).
        // Note: places that match by applicationId (such as packageNames in accessibility_config.xml)
        // must stay in sync with this value.
        applicationId "com.mifreeform.freeform"
        minSdk 27
        targetSdk 32
        // versionCode must increase with features; otherwise, when it equals an already-installed version with the
        // same package name, the system treats it as "no update" and refuses an in-place install.
        versionCode 2552
        versionName "2.5.39"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // Supported SO library ABIs
            abiFilters 'arm64-v8a','armeabi-v7a' //, 'x86', 'armeabi-v7a', 'x86_64', 'arm64-v8a'
        }
    }

    signingConfigs {
        // Note: once the key changes, packages already on the device cannot be upgraded in place because their signature differs — uninstall them first.
        if (localSigningReady) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
            debug {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // The debug build additionally bundles x86/x86_64, otherwise an x86_64 emulator hits INSTALL_FAILED_NO_MATCHING_ABIS.
            // abiFilters in buildTypes is unioned with defaultConfig, so release still ships arm only.
            ndk {
                abiFilters 'x86', 'x86_64'
            }
        }
        release {
            zipAlignEnabled true
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use local signing material when present; otherwise leave it empty (produce an unsigned release),
            // rather than signing with a nonexistent file or using the upstream author's key.
            if (localSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

configurations.all {
    exclude group: 'androidx.appcompat', module: 'appcompat'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.7.0-alpha03'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'

    compileOnly files('libs/XposedBridgeAPI-89.jar')

    implementation("dev.rikka.rikkax.appcompat:appcompat:1.5.0.1")
    implementation("dev.rikka.rikkax.widget:borderview:1.1.0")
    implementation("dev.rikka.rikkax.recyclerview:recyclerview-ktx:1.3.1")

    def shizuku_version = '12.1.0'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    def room_version = "2.4.3"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    def preference_version = "1.2.0"
    implementation "androidx.preference:preference-ktx:$preference_version"
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'

    implementation 'io.github.biezhi:TinyPinyin:2.0.3.RELEASE'

    implementation 'com.github.bumptech.glide:glide:4.13.2'

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation 'com.tencent.bugly:crashreport:latest.release'

    implementation 'com.github.megatronking.stringfog:xor:3.0.0'
}